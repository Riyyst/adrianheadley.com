w.adrianheadley.com/#website","url":"https://www.adrianheadley.com/","name":"Adrian Headley","alternateName":"Adrian Headley Portfolio","description":"Personal portfolio of Adrian Headley covering career, projects, articles and AH Consultancy.","inLanguage":"en-GB","publisher":{"@id":"https://www.adrianheadley.com/#person"}},{"@type":"Person","@id":"https://www.adrianheadley.com/#person","name":"Adrian Headley","url":"https://www.adrianheadley.com/","image":{"@type":"ImageObject","url":"https://www.adrianheadley.com/Assets/Media/Images/Profile/portrait.jpg","contentUrl":"https://www.adrianheadley.com/Assets/Media/Images/Profile/portrait.jpg","width":872,"height":823},"email":"mailto:contact@adrianheadley.com","jobTitle":["Medical Staffing & Recruitment Officer","IT Lead"],"description":"NHS medical staffing and recruitment professional, digital operations and IT lead, law student, and project builder.","homeLocation":{"@type":"Place","name":"Suffolk, England, United Kingdom"},"sameAs":["https://www.linkedin.com/in/adrianheadley/","https://www.facebook.com/AdrianHeadley04/","https://x.com/adrianheadleyhq"],"knowsAbout":["NHS recruitment","Medical staffing","Digital operations","Information technology","Business operations","Law","Web development","Data analysis"]},{"@type":"Article","@id":"https://www.adrianheadley.com/Pages/articles.html#time-is-money","headline":"Time Is Money","alternativeHeadline":"Every Second Your Site Wastes Costs You Sales","description":"A research-led article on how website speed affects e-commerce conversions, bounce rates, user experience and sales.","articleSection":"Business Articles","articleBody":"You have probably heard the phrase ‘time is money’, but in e-commerce it's not just a saying, it is a measurable reality backed by data from major research programmes. In the study Milliseconds Make Millions, commissioned by Google and conducted by Deloitte and analytics firm fifty-five, researchers analysed more than 30 million mobile user sessions across 37 retail, travel, luxury and lead-generation brands in Europe and the United States. They found that a natural 0.1-second improvement in mobile site speed was associated with an 8.4% increase in retail conversion rate and a 9.2% increase in average order value, with similar gains in travel and lead-generation funnels. The same report breaks down where speed matters most in the journey. A 0.1-second improvement produced a 3.2% increase in progression from product listing pages to product detail pages and a 9.1% increase from product detail pages to add-to-basket pages. In other words, the benefit compounds exactly at the points where most e-commerce sites lose volume. Google’s own web.dev case study summarising this research presents the same findings for developers and performance practitioners. A separate large-scale study from Akamai, the State of Online Retail Performance, looked at performance data from roughly 10 billion user visits to leading retail sites. Akamai’s analysis found that a 100-millisecond delay in page load can hurt conversion rates by about 7%, and that a two-second delay can increase bounce rates by over 100%. Their summary makes the point clear. Even 100-millisecond delays can impact customer engagement and online revenue, and 53% of mobile visitors leave a page that takes longer than three seconds to load. Google’s own mobile speed research reaches the same conclusions. In its DoubleClick mobile web speed work, presented in the Get your mobile site in shape toolkit, Google reports that 53% of mobile site visits are abandoned if a page takes longer than three seconds to load. The toolkit ties load time directly to commercial outcomes and encourages site owners to measure and improve mobile performance as part of their broader business strategy. With all the research put together, these studies tell a consistent story. Even small changes in load times are associated with noticeable differences in how many visitors progress, and how much they spend when they do. Once pages cross roughly three seconds on mobile, abandonment rises sharply, and every extra second becomes a tangible commercial cost. None of this is based on anecdote. It comes from large-scale measurements of real sessions, monitored hour by hour across many brands and industries. The human side is straightforward. People don't arrive on a website to admire its structure and layout, but rather to complete a task, often on a phone with a variable connection. If the path to that task is smooth and quick, they are more likely to finish it and remember the experience positively. If it is slow or uneven, many will leave, and the business never sees the revenue that might have followed. This is why Google’s own guidance now treats mobile speed, Core Web Vitals and abandonment as part of the same conversation. Performance is both a user-experience issue and a commercial one. It is worth asking why those few seconds matter so much. People shopping online are not always in a rush, and many browse on the sofa or idly scroll during a commute. The problem is less about absolute time and more about expectation and perception. Google’s mobile performance work reports that around 53% of mobile visitors abandon a site that takes more than three seconds to load, and that pages loading in nineteen seconds on typical 3G connections see dramatically higher bounce and lower engagement than pages loading in five seconds. Studies of perceived speed show that users feel waits are longer than they really are, and people experience load times as roughly 15% slower than measurement tools report, as described in SpeedCurve’s “The psychology of site speed and human happiness” and Wired’s “The Science of Waiting ... for Your Page to Load”. Contrary to the popular claim that our attention spans have simply collapsed to a few seconds, there is little scientific evidence that humans now possess a fixed, eight-second window beyond which they cannot focus. What recent work suggests instead is that attention online is highly task-dependent and shaped by cognitive load, control and context. Delays of more than about two seconds break concentration, increase stress responses and make users feel powerless, especially when they have many other tabs or apps to switch to, according to “The Psychology of Loading Screens and User Patience” and “The Psychology of Waiting: Skeletons”. On mobile, where connections are more variable and usage is often fragmented into short, opportunistic windows, that effect is amplified, with surveys and performance studies consistently finding that people are less patient on phones than on a desktop and treat speed as one of the most important parts of the experience. In that light, the “three second rule” is not arbitrary, but it does reflect the point at which waiting ceases to feel like part of the journey and starts to feel like a problem. For any e-commerce business, a useful question to ask is not simply ‘Is my site online?’ but ‘How much time am I asking visitors to spend waiting, and what does the best available research say that delay is costing me?’. The answer will never appear as a neat line in a profit and loss statement labelled ‘lost to slow pages’, but the impact is real. When time is money, the seconds between a customer’s intent and your response become one of the most important parts of the business to understand.","citation":["https://www.deloitte.com/ie/en/services/consulting/research/milliseconds-make-millions.html","https://www.ir.akamai.com/news-releases/news-release-details/akamai-online-retail-performance-report-milliseconds-are","https://www.thinkwithgoogle.com/_qs/documents/3702/9e6a3_DoubleClick_Mobile_Web_Speed_Toolkit_10_17_2016.pdf","https://www.marketingdive.com/news/google-53-of-mobile-users-abandon-sites-that-take-over-3-seconds-to-load/426070/","https://www.speedcurve.com/blog/psychology-site-speed/","https://www.wired.com/2016/08/science-waiting-waiting-page-load/","https://wisetech.ae/it-solutions/psychology-of-loading-screens-user-patience/","https://medium.com/@elenech/the-psychology-of-waiting-skeletons-ca3b309e12a2"],"author":{"@id":"https://www.adrianheadley.com/#person"},"publisher":{"@id":"https://www.adrianheadley.com/#person"},"datePublished":"2026-09-03","dateModified":"2026-09-03","isPartOf":{"@id":"https://www.adrianheadley.com/Pages/articles.html#webpage"},"inLanguage":"en-GB"},{"@type":"Article","@id":"https://www.adrianheadley.com/Pages/articles.html#what-is-this-website","headline":"What is this website?","alternativeHeadline":"A short introduction","description":"A short introduction to the purpose of Adrian Headley’s website and what can be found across Career, Business, Projects and Articles.","articleBody":"This website is my personal portfolio. It brings my professional experience, projects, business work and writing into one place. The Career section sets out my professional background and ongoing development. The Business section covers work and services outside my main employment, while Projects highlights practical things I have built or developed. Articles gives me a separate space for longer pieces of writing. The site is kept simple and lightweight, designed for desktop, tablet and mobile, with accessibility controls available in the header. The aim is to keep one clear, up-to-date place for my work and interests.","author":{"@id":"https://www.adrianheadley.com/#person"},"publisher":{"@id":"https://www.adrianheadley.com/#person"},"datePublished":"2026-08-28","dateModified":"2026-08-28","isPartOf":{"@id":"https://www.adrianheadley.com/Pages/articles.html#webpage"},"inLanguage":"en-GB"},{"@type":"ItemList","@id":"https://www.adrianheadley.com/Pages/articles.html#articles","name":"Articles by Adrian Headley","itemListElement":[{"@type":"ListItem","position":1,"item":{"@id":"https://www.adrianheadley.com/Pages/articles.html#time-is-money"}},{"@type":"ListItem","position":2,"item":{"@id":"https://www.
